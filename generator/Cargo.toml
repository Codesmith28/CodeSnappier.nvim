[package]
name = "generator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
codesnap = { version = "0.13.4", features = ["full"] }
mlua = { version = "0.10.0", features = ["module", "luajit", "serialize"] }
serde = { version = "1.0.204", features = ["derive"] }
tokio = { version = "1.44.2", features = ["rt", "rt-multi-thread"] }
# Use system OpenSSL
openssl = { version = "0.10" }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
cosmic-text = { version = "0.14", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

