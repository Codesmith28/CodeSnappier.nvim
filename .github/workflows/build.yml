name: Build & Release Precompiled Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.os_name }} with rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            origin_dylib_suffix: so
            dest_dylib_suffix: so

          - os_name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            origin_dylib_suffix: so
            dest_dylib_suffix: so

          - os_name: mac-x86_64
            os: macOS-latest
            target: x86_64-apple-darwin
            origin_dylib_suffix: dylib
            dest_dylib_suffix: so

          - os_name: mac-aarch64
            os: macOS-latest
            target: aarch64-apple-darwin
            origin_dylib_suffix: dylib
            dest_dylib_suffix: so

          - os_name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            origin_dylib_suffix: dll
            dest_dylib_suffix: dll

        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies for vendored builds
        if: contains(matrix.platform.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y make perl pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build link lib (cross)
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: "build"
          working-directory: ./generator
          target: ${{ matrix.platform.target }}
          toolchain: ${{ matrix.toolchain }}
          args: "--release"

      - name: Build link lib (native / host)
        if: matrix.platform.target != 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          cd generator
          cargo build --release --target ${{ matrix.platform.target }}

      - name: List files
        shell: bash
        run: ls -R generator/target/${{ matrix.platform.target }}/release/

      - name: Prepare dynamic libs
        shell: bash
        run: |
          mkdir -p dist
          src_lib="generator/target/${{ matrix.platform.target }}/release/${{ startsWith(matrix.platform.target, 'x86_64-pc-windows-msvc') && 'generator' || 'libgenerator' }}.${{ matrix.platform.origin_dylib_suffix }}"
          cp -rf "$src_lib" "dist/${{ matrix.platform.os_name }}_generator.${{ matrix.platform.dest_dylib_suffix }}"
          cp -rf "$src_lib" "dist/${{ matrix.platform.os_name }}generator.${{ matrix.platform.dest_dylib_suffix }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.os_name }}_generator
          path: dist/*

  upload-to-release:
    name: Upload to GitHub Release
    needs: build
    if: always() && !cancelled() && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check artifacts
        id: check_artifacts
        shell: bash
        run: |
          if [ -d artifacts ] && [ -n "$(find artifacts -type f 2>/dev/null)" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload to release
        if: steps.check_artifacts.outputs.found == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v2.1.1' }}
          name: Release ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v2.1.1' }}
          generate_release_notes: true
          files: |
            artifacts/**/*
